# The Wolf Émulateur — Android APK build (fork of ARMSX2, GPL-3.0).
#
# Manual only: Actions tab -> "The Wolf - APK Android" -> "Run workflow".
# Builds the "github" flavor release APK. Without a private keystore the APK is
# signed with the runner's debug key, which is enough to sideload it.
name: The Wolf - APK Android

on:
  workflow_dispatch:

concurrency:
  group: thewolf-android
  cancel-in-progress: true

jobs:
  android:
    name: APK Android (arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        working-directory: platforms/android
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install NDK + CMake
        run: yes | sdkmanager "ndk;29.0.14206865" "cmake;3.31.6" >/dev/null || true

      - name: Fetch shaderc third-party deps
        run: python3 app/src/main/cpp/3rdparty/shaderc/utils/git-sync-deps

      - name: Install Rust Android target
        run: rustup target add aarch64-linux-android

      - name: Build release APK
        run: ./gradlew :app:assembleGithubRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: TheWolf-Emulateur-APK
          path: platforms/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
